[package]
name = "sorte-desktop"
version = "0.1.0"
description = "SORTÉ Desktop — intelligent recycling"
edition = "2021"
publish = false

[lib]
name = "sorte_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS credential store: macOS Keychain, Windows Credential Manager.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# rustls: no OpenSSL dependency; no redirects are followed (see http.rs).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
# Signed in-app updates from GitHub Releases, and relaunch after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Opens the "get a key" pages in the default browser; hosts are limited in capabilities.
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
