# Every push to main that touches the app publishes a signed release, and
# installed apps pick it up through latest.json. The release stays a draft
# until every platform has built, so apps never see a half-finished one.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "apps/web/**"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version.split('.').slice(0,2).join('.')")
          echo "version=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      # Let every platform finish so one failure doesn't hide another; publish still needs all of them.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Check update signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing. Add the contents of ~/.tauri/sorte.key under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/bump-version.mjs ${{ needs.version.outputs.version }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing (required). The private key never lives in the repo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # With an Apple Developer ID, add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID here.
        with:
          projectPath: apps/desktop
          tagName: v${{ needs.version.outputs.version }}
          releaseName: SORTÉ v${{ needs.version.outputs.version }}
          releaseBody: ${{ github.event.head_commit.message }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "v${{ needs.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
